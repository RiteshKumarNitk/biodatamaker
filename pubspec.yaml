name: biodata_maker
description: "A premium marriage biodata maker app with offline-first architecture."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  flutter_animate: ^4.5.0
  lottie: ^3.1.2
  responsive_framework: ^1.5.0

  # State Management
  flutter_riverpod: ^2.5.1

  # Routing
  go_router: ^14.1.2

  # Local Storage
  hive_flutter: ^1.1.0
  hive: ^2.2.3
  shared_preferences: ^2.2.3

  # Data Models
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # PDF
  pdf: ^3.10.8
  printing: ^5.12.0

  # Images
  image_picker: ^1.0.7
  image: ^4.1.7
  crop_image: ^1.0.17
  path_provider: ^2.1.3

  # File System
  file_picker: ^8.0.0
  share_plus: ^9.0.0

  # Utilities
  uuid: ^4.4.0
  intl: ^0.19.0
  collection: ^1.18.0

  # Permissions
  permission_handler: ^11.3.1

  # Future Cloud (optional)
  google_sign_in: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.9
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/svg/
    - assets/lottie/
