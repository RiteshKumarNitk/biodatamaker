name: biodata_maker
description: "A premium marriage biodata maker app with offline-first architecture."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  flutter_animate: ^4.5.0
  lottie: ^3.1.0

  # State Management (Bloc)
  flutter_bloc: ^8.1.6
  bloc: ^8.1.4
  equatable: ^2.0.7

  # Dependency Injection
  get_it: ^8.0.3

  # Routing
  go_router: ^14.1.2

  # Local Storage
  hive_flutter: ^1.1.0
  hive: ^2.2.3
  shared_preferences: ^2.2.3

  # Data Models
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # PDF
  pdf: ^3.10.8
  printing: ^5.12.0

  # Images
  image_picker: ^1.0.7
  image: ^4.1.7
  crop_image: ^1.0.17
  path_provider: ^2.1.3

  # File System
  file_picker: ^8.0.0
  share_plus: ^12.0.2

  # Android Downloads/MediaStore exports (PDF)
  media_store_plus: ^0.1.3

  # Utilities
  uuid: ^4.4.0
  intl: ^0.20.2
  collection: ^1.18.0

  # Permissions
  permission_handler: ^11.3.1

  # Security
  flutter_secure_storage: ^9.2.2

  # Links
  url_launcher: ^6.3.0

  # In-app purchases (real store billing for premium)
  # removed in favor of rewarded ads

  # Save exported images to the device gallery
  gal: ^2.3.0

  # Admin password hashing
  crypto: ^3.0.3

  # Future Cloud (optional)
  google_sign_in: ^6.2.1

  # Ads
  google_mobile_ads: ^5.3.0
  flutter_colorpicker: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_native_splash: ^2.4.1
  flutter_launcher_icons: ^0.13.1
  build_runner: ^2.4.9
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/svg/
    - assets/lottie/
    - assets/google_logo.png
    - assets/templates/
    - assets/fonts/
    - assets/icon.png
    - assets/images/

flutter_native_splash:
  color: "#C62828"
  image: "assets/icon.png"
  android: true
  ios: true
  web: false

flutter_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon.png"
  adaptive_icon_background: "#C62828"
  adaptive_icon_foreground: "assets/icon.png"
